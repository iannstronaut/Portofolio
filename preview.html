<style>
:root {
	color-scheme: light;
	--paper: #fbfcfd;
	--ink: #202b38;
	--muted: #4d5c6e;
	--line: #dce3ea;
	--accent: #174b82;
	--tint: #edf3f9;
	--gutter: clamp(1.125rem, 4vw, 3rem);
}

*, *::before, *::after { box-sizing: border-box; }

body {
	margin: 0;
	background: var(--paper);
	color: var(--ink);
	font-family: Inter, system-ui, sans-serif;
	line-height: 1.65;
	-webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
ol, ul { padding: 0; list-style: none; }
a { color: inherit; text-decoration: underline; text-underline-offset: 0.2em; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.mac-desktop {
	display: grid;
	grid-template-rows: 2rem minmax(0, 1fr) auto;
	height: 100vh;
	height: 100dvh;
	overflow: hidden;
	background:
		linear-gradient(156deg, transparent 46%, #88bed62e 46.2%, transparent 70%),
		linear-gradient(156deg, #102131 0%, #173a55 45%, #27617c 73%, #142c45 100%);
}

.mac-menu {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 0.5rem;
	padding-inline: clamp(0.75rem, 2vw, 1.5rem);
	border-block-end: 1px solid #ffffff24;
	background: #0c182abe;
	color: #f1f5fa;
	font-size: 0.75rem;
	line-height: 1.2;
}

.mac-menu-app, .mac-menu time { display: flex; align-items: center; gap: clamp(0.5rem, 2vw, 1rem); }
.mac-menu-app span { color: #d4e0ec; }
.mac-menu time { font-variant-numeric: tabular-nums; white-space: nowrap; }

.mac-workspace {
	display: grid;
	grid-template-rows: minmax(0, 1fr);
	padding: clamp(0.5rem, 1.8vw, 1.75rem) clamp(0.5rem, 3.25vw, 3.5rem) 0;
}

.mac-workspace.mac-expanded { padding: 0; }
.mac-expanded .safari-window { border-radius: 0; }

.safari-window {
	display: grid;
	grid-template-rows: auto minmax(0, 1fr);
	width: 100%;
	max-width: 88rem;
	margin-inline: auto;
	overflow: hidden;
	border: 1px solid #ffffff92;
	border-radius: 12px;
	background: var(--paper);
	box-shadow: 0 22px 58px #06152675, 0 2px 8px #0615265e;
	transform-origin: 50% 110%;
	animation: safari-open 680ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

.mac-expanded .safari-window { max-width: none; }
.safari-window[hidden] { display: none; }

@keyframes safari-open {
	from { opacity: 0; transform: translate(-4.65rem, 45%) scale(0.25, 0.12); }
	55% { opacity: 1; }
	to { opacity: 1; transform: none; }
}

.safari-toolbar {
	position: relative;
	display: grid;
	grid-template-columns: minmax(max-content, 1fr) minmax(0, 20rem) 1fr;
	align-items: center;
	gap: 0.5rem;
	min-height: 2.25rem;
	padding: 0.25rem 0.75rem;
	border-block-end: 1px solid #d0d8e1;
	background: #edf1f5;
}

.safari-toolbar::after {
	position: absolute;
	inset: auto 0 -1px;
	height: 2px;
	background: #3977ac;
	content: "";
	pointer-events: none;
	transform: scaleX(var(--scroll-progress, 0));
	transform-origin: left;
}

.window-controls { display: flex; align-items: center; gap: 0.0625rem; }

.window-controls button {
	display: grid;
	width: 1.5rem;
	height: 1.5rem;
	place-items: center;
	padding: 0;
	border: 0;
	border-radius: 50%;
	background: radial-gradient(circle, var(--control-color) 0 6px, #162b4440 6px 7px, transparent 7px);
	color: transparent;
	font-size: 0.75rem;
	font-weight: 700;
	line-height: 1;
	cursor: pointer;
}

.window-controls:hover button, .window-controls button:focus-visible { color: #202934; }
.window-close { --control-color: #ff625b; }
.window-minimize { --control-color: #f8be4f; }
.window-expand { --control-color: #53c86e; }

.safari-address {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 0.25rem;
	min-height: 1.375rem;
	border: 1px solid #d8dfe6;
	border-radius: 6px;
	background: #fafbfd;
	color: var(--muted);
	font-size: 0.75rem;
	line-height: 1.15;
}

.safari-address svg { width: 0.75rem; height: 0.75rem; }
.browser-viewport {
	--topbar-height: 3.375rem;
	overflow: auto;
	overflow-anchor: none;
	overscroll-behavior: contain;
	scroll-padding-top: calc(var(--topbar-height) + 0.875rem);
}
.browser-viewport:focus-visible { outline-offset: -2px; }

.mac-dock {
	display: flex;
	justify-self: center;
	gap: 0.625rem;
	margin: 0.625rem 0 0.625rem;
	padding: 0.4rem 0.625rem;
	border: 1px solid #ffffff61;
	border-radius: 1rem;
	background: #b8d4ea41;
	box-shadow: 0 6px 16px #0615265e;
}

.dock-item {
	position: relative;
	display: grid;
	place-items: center;
	width: 2.5rem;
	height: 2.75rem;
	padding: 0 0 0.25rem;
	border: 0;
	border-radius: 0.625rem;
	background: none;
	text-decoration: none;
	cursor: pointer;
}

.dock-item[aria-expanded="true"]::after {
	position: absolute;
	inset: auto auto 0;
	width: 0.25rem;
	height: 0.25rem;
	border-radius: 50%;
	background: #f8fbff;
	content: "";
}

.dock-item:focus-visible { outline-color: #fff; }

.dock-tile {
	display: grid;
	width: 100%;
	height: 100%;
	place-items: center;
	border: 1px solid #ffffff54;
	border-radius: 0.625rem;
	color: white;
	box-shadow: 0 2px 5px #091e3780;
	transition: transform 150ms ease;
}

.dock-item:hover .dock-tile, .dock-item:focus-visible .dock-tile { transform: translateY(-0.2rem); }
.dock-tile svg { width: 1.375rem; height: 1.375rem; }
.dock-safari { background: #1966a9; }
.dock-cv { background: #f6f7fb; color: #283f59; }
.dock-github { background: #242d3a; }
.dock-mail { background: #347faa; }

.mac-dock { --boot-duration: 1.65s; }

.boot-cursor {
	position: absolute;
	z-index: 3;
	top: 35%;
	left: 45%;
	overflow: visible;
	transform-origin: 5px 3px;
	filter: drop-shadow(0 2px 3px #0008);
	pointer-events: none;
	animation: safari-click var(--boot-duration) both;
}

.dock-item:has(.boot-cursor) .dock-safari { animation: safari-bounce var(--boot-duration) both; }

@keyframes safari-click {
	0%, 15% { transform: translate(19vw, -47vh); animation-timing-function: cubic-bezier(0.5, 0, 0.2, 1); }
	68% { transform: none; animation-timing-function: ease-out; }
	74% { transform: scale(0.76); }
	83%, 94% { opacity: 1; transform: none; }
	to { opacity: 0; }
}

@keyframes safari-bounce {
	0%, 74%, 95%, 100% { transform: none; }
	85% { transform: translateY(-0.65rem); }
}

.dock-label {
	position: absolute;
	z-index: 2;
	bottom: calc(100% + 0.5rem);
	left: 50%;
	padding: 0.25rem 0.5rem;
	border-radius: 5px;
	background: #152638;
	color: #fff;
	font-size: 0.75rem;
	white-space: nowrap;
	pointer-events: none;
	opacity: 0;
	transform: translateX(-50%);
}

.dock-item:hover .dock-label, .dock-item:focus-visible .dock-label { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
	.safari-window, .boot-cursor, .dock-item:has(.boot-cursor) .dock-safari { animation: none; }
	.dock-tile { transition: none; }
}

.site-main, .topbar-inner {
	max-width: 74rem;
	margin-inline: auto;
	padding-inline: var(--gutter);
}

.skip-link {
	position: fixed;
	z-index: 3;
	top: 3rem;
	left: var(--gutter);
	padding: 0.5rem 1rem;
	background: var(--paper);
	clip-path: inset(50%);
}

.skip-link:focus { clip-path: none; }

.site-topbar {
	position: sticky;
	z-index: 2;
	top: 0;
	background: #f8fbfef0;
	box-shadow: inset 0 -1px 0 #d0dce8;
	backdrop-filter: blur(16px);
}

.topbar-inner {
	display: grid;
	grid-template-columns: auto minmax(0, 1fr) auto;
	grid-template-rows: var(--topbar-height);
	align-items: center;
	column-gap: clamp(0.625rem, 2vw, 1.5rem);
}

.brand {
	display: inline-flex;
	min-width: 0;
	align-items: center;
	gap: 0.625rem;
	font-size: 0.875rem;
	font-weight: 650;
	line-height: 1.3;
	text-decoration: none;
}

.brand-name { display: none; }

.monogram {
	display: grid;
	flex: 0 0 2rem;
	height: 2rem;
	place-items: center;
	border-radius: 0.625rem;
	background: linear-gradient(145deg, #153453, #246bb0);
	color: white;
	font-size: 0.75rem;
	letter-spacing: 0.055em;
}

.languages {
	display: flex;
	gap: 0.125rem;
	padding: 0.125rem;
	border: 1px solid #d9e3ee;
	border-radius: 0.75rem;
	background: #e9f0f7;
}

.languages button {
	min-width: 2rem;
	min-height: 1.75rem;
	padding: 0 0.25rem;
	border: 1px solid transparent;
	border-radius: 0.5rem;
	background: transparent;
	color: var(--muted);
	font-size: 0.75rem;
	font-weight: 650;
	cursor: pointer;
}

.languages button:hover, .languages button[aria-pressed="true"] {
	border-color: var(--line);
	background: #fff;
	color: var(--accent);
}

.site-nav {
	display: flex;
	min-width: 0;
	justify-content: safe center;
	align-items: center;
	gap: 0.125rem;
	overflow-x: auto;
	padding: 0.1875rem;
	border: 1px solid #d9e3ee;
	border-radius: 0.75rem;
	background: #ffffffa6;
	scrollbar-width: thin;
}

.site-nav a {
	flex: none;
	padding: 0.375rem 0.625rem;
	border-radius: 0.5rem;
	color: var(--muted);
	font-size: 0.8125rem;
	font-weight: 550;
	line-height: 1.35;
	text-decoration: none;
	white-space: nowrap;
}

.site-nav a:hover { color: var(--accent); background: var(--tint); }
.site-nav a[aria-current] { background: #e1edf9; }
.site-nav a:focus-visible { outline-offset: -2px; }

.browser-viewport {
	background: #eceff4;
	background-image:
		radial-gradient(820px 600px at 100% 0%, #0066cc1f, transparent 58%),
		radial-gradient(720px 560px at 0% 4%, #0066cc14, transparent 56%),
		radial-gradient(900px 700px at 50% 100%, #0f586214, transparent 60%),
		radial-gradient(#0d27401c 0.6px, transparent 0.6px);
	background-size: auto, auto, auto, 22px 22px;
	background-attachment: local;
}

.site-main {
	--content-ink: #1d1d1f;
	--content-muted: #52525b;
	--content-accent: #0066cc;
	--mono: "JetBrains Mono", ui-monospace, monospace;
	container-type: inline-size;
	min-width: 0;
	color: var(--content-ink);
}

.glass-card {
	position: relative;
	min-width: 0;
	border: 1px solid #ffffffa6;
	border-radius: 18px;
	background: linear-gradient(180deg, #ffffffc7, #ffffff8f);
	box-shadow: 0 1px 0 #ffffffb3 inset, 0 18px 40px -26px #0d274080, 0 2px 8px -5px #0d274047;
}

.glass-hover { transition: transform 250ms ease, box-shadow 250ms ease; }

@media (hover: hover) and (prefers-reduced-motion: no-preference) {
	.glass-hover:hover {
		transform: translateY(-3px);
		box-shadow: 0 1px 0 #ffffffb3 inset, 0 30px 58px -28px #0d27408c, 0 5px 14px -8px #0d27404d;
	}
}

.hero {
	display: grid;
	gap: 1rem;
	padding-block: clamp(1.5rem, 3vw, 2.5rem) 2.5rem;
}

.hero-lead, .summary-card { padding: clamp(1.25rem, 3vw, 2.25rem); }
.hero-profile, .hero-clock, .content-card { padding: clamp(1rem, 2vw, 1.5rem); }
.hero-lead, .hero-profile, .hero-clock { display: flex; flex-direction: column; }
.hero-profile, .hero-clock { justify-content: space-between; gap: 0.5rem; }
.hero-profile p { font-size: 1.125rem; font-weight: 650; letter-spacing: -0.02em; }
.hero-profile div span, .hero-profile > span:last-child, .hero-clock > span:last-child { color: var(--content-muted); font-size: 0.8125rem; }
.hero-clock time { font: 500 1.875rem/1.2 var(--mono); letter-spacing: -0.04em; }

.profile-monogram {
	display: grid;
	width: 3rem;
	height: 3rem;
	place-items: center;
	border-radius: 1rem;
	background: linear-gradient(135deg, #13314f, var(--content-accent));
	color: white;
	font-weight: 650;
}

.availability {
	display: inline-flex;
	align-items: center;
	align-self: start;
	gap: 0.5rem;
	margin-block-end: 1.25rem;
	padding: 0.2rem 0.68rem;
	border: 1px solid #bce6d0;
	border-radius: 999px;
	background: #ecfdf5;
	color: #047857;
	font-size: 0.75rem;
	font-weight: 550;
}

.availability::before { content: ""; flex: 0 0 0.375rem; height: 0.375rem; border-radius: 50%; background: #059669; }
.hero h1 { max-width: 24ch; font-size: clamp(1.875rem, 3.7vw, 3.25rem); font-weight: 650; line-height: 1.05; letter-spacing: -0.045em; text-wrap: balance; }
.hero-intro, .summary-copy { max-width: 68ch; color: var(--content-muted); font-size: 1.0625rem; }
.hero-intro { margin-block-start: 1rem; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 0.625rem; margin-block-start: 1.5rem; }
.hero-lead > .chip-list { margin-block-start: auto; padding-block-start: 1.5rem; }

.button {
	display: inline-flex;
	min-height: 2.625rem;
	align-items: center;
	gap: 0.5rem;
	padding: 0.5rem 1rem;
	border: 1px solid #c8cdd6;
	border-radius: 999px;
	font-size: 0.875rem;
	font-weight: 600;
	text-decoration: none;
}

.button-primary { border-color: transparent; background: var(--content-accent); color: white; }
.button-primary:hover { background: #0052a3; }
.button-secondary:hover { background: #ffffffb3; }

.portfolio-section { margin-block-end: clamp(2.75rem, 6vw, 5rem); }
.section-heading { margin-block-end: 1.25rem; }
.section-heading h2 { font-size: clamp(1.5rem, 2.6vw, 1.875rem); font-weight: 650; line-height: 1.2; letter-spacing: -0.035em; }
.eyebrow { margin-block-end: 0.3rem; color: var(--content-accent); font: 500 0.6875rem/1.5 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }

.stats {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(min(100%, 7rem), 1fr));
	gap: 1px;
	margin-block-start: 1.5rem;
	overflow: hidden;
	border: 1px solid #dae0e7;
	border-radius: 0.75rem;
	background: #dae0e7;
}
.stats > div { display: flex; flex-direction: column-reverse; padding: 0.875rem 1rem; background: #ffffffc4; }
.stats dt { color: var(--content-muted); font-size: 0.8125rem; }
.stats dd { color: var(--content-accent); font: 600 1.5rem/1.25 var(--mono); }

.timeline { display: grid; gap: 1rem; margin-inline-start: 0.35rem; padding-inline-start: 1.35rem; border-inline-start: 1px solid #c5cdd8; }
.timeline > li::before {
	position: absolute;
	top: 1.3rem;
	left: -1.72rem;
	width: 0.625rem;
	height: 0.625rem;
	border-radius: 50%;
	background: var(--content-accent);
	box-shadow: 0 0 0 4px #eceff4;
	content: "";
}

.card-grid { display: grid; gap: 1rem; }
.card-top { display: flex; align-items: baseline; flex-wrap: wrap; justify-content: space-between; gap: 0.15rem 0.75rem; }
.site-main h3 { font-size: 1rem; font-weight: 650; line-height: 1.35; }
.row-meta { color: #535e70; font: 0.6875rem/1.6 var(--mono); letter-spacing: 0.055em; text-transform: uppercase; }
.attribution { margin-block-start: 0.25rem; color: var(--content-accent); font-size: 0.875rem; }
.description { margin-block-start: 0.45rem; color: var(--content-muted); font-size: 0.875rem; white-space: pre-line; }
.chip-list { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; margin-block-start: 0.75rem; }
.chip-list li { padding: 0.175rem 0.65rem; border: 1px solid #18181b14; border-radius: 999px; background: #18181b0a; color: var(--content-muted); font-size: 0.75rem; }
.skills-card { padding: 0.5rem 1rem; }
.skills-card > li { display: grid; align-items: start; gap: 0.5rem; padding: 1rem 0.25rem; }
.skills-card > li + li { border-block-start: 1px solid #dce3ea; }
.skills-card .chip-list { margin: 0; }

.project-card { display: grid; align-content: start; height: 100%; gap: 0.75rem; padding: 0.75rem; text-decoration: none; }
.project-copy { padding: 0 0.25rem 0.25rem; }
.project-copy .row-meta { margin-block-start: 0.65rem; }
.project-copy h3 span { color: var(--content-accent); }

.mini-win { min-height: 9rem; overflow: hidden; display: grid; grid-template-rows: auto 1fr; border: 1px solid #ccd8e3; border-radius: 0.75rem; background: #f7fafc; }
.mini-toolbar { display: flex; align-items: center; gap: 0.25rem; padding: 0.5rem 0.625rem; border-block-end: 1px solid #e2e8f0; background: #f0f4f8; }
.mini-toolbar i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #ff625b; }
.mini-toolbar i:nth-child(2) { background: #f8be4f; }
.mini-toolbar i:nth-child(3) { background: #53c86e; }
.mini-toolbar b { flex: 1; height: 0.625rem; margin-inline: 0.2rem; border-radius: 0.2rem; background: #fff; }
.mini-stage { display: grid; gap: 0.4rem; padding: 0.75rem; }
.mini-chart .mini-stage { grid-template-columns: repeat(7, 1fr); align-items: end; }
.mini-chart .mini-stage i { height: 52%; border-radius: 0.25rem 0.25rem 0 0; background: linear-gradient(#6fb5e8, #1d70b4); }
.mini-chart .mini-stage i:nth-child(even) { height: 68%; }
.mini-chart .mini-stage i:nth-child(3n) { height: 83%; }
.mini-tiles .mini-stage { grid-template-columns: repeat(4, 1fr); }
.mini-tiles .mini-stage i { border-radius: 0.25rem; background: #a7cde9; }
.mini-tiles .mini-stage i:nth-child(3n + 1) { background: #296fa9; }
.mini-tiles .mini-stage i:nth-child(3n) { background: #dbe6f1; }
.mini-editor .mini-stage { grid-template-rows: repeat(7, 1fr); background: #152538; }
.mini-editor .mini-stage i { width: 62%; border-radius: 0.25rem; background: #367eab; }
.mini-editor .mini-stage i:nth-child(2n) { width: 38%; background: #4aa592; }
.mini-editor .mini-stage i:nth-child(3n) { width: 76%; background: #576b82; }

.contact-section { padding: clamp(1.25rem, 4vw, 3rem); margin-block-end: 2rem; }
.contact-section .section-heading { margin-block-end: 0.75rem; }
.contact-section .hero-actions li { min-width: 0; }
.contact-email { display: block; overflow-wrap: anywhere; }
.contact-handle, .contact-section .button-secondary span { color: var(--content-muted); }
.site-footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.25rem 1rem; padding-block: 1.75rem 2rem; border-block-start: 1px solid var(--line); color: var(--muted); font-size: 0.8125rem; }

@container (min-width: 33rem) {
	.hero { grid-template-columns: repeat(3, minmax(0, 1fr)); }
	.hero-lead { grid-column: span 2; grid-row: span 2; }
	.card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
	.project-feature { grid-column: span 2; }
	.project-feature .project-card { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: center; }
	.project-feature .mini-win { min-height: 12rem; }
	.skills-card > li { grid-template-columns: 9rem minmax(0, 1fr); }
}

.load-status { margin: 2rem var(--gutter); }

@media (min-width: 72rem) {

<script type="text/babel" data-presets="react">
const { useState, useEffect, useLayoutEffect, useRef } = React

/* ============================================================
   Content loading
   - Vite/production: fetched from /content.json at runtime, so the site
     can be re-edited without rebuilding or redeploying.
   - Standalone preview.html: reads window.__CONTENT__ (inlined), because
     file:// cannot fetch local JSON.
   ============================================================ */

function useLoadedContent() {
	const [data, setData] = useState(
		typeof window !== "undefined" && window.__CONTENT__ ? window.__CONTENT__ : null,
	)
	const [error, setError] = useState(false)
	useEffect(() => {
		if (data) return
		let alive = true
		fetch("content.json", { cache: "no-store" })
			.then((r) => {
				if (!r.ok) throw new Error("load failed")
				return r.json()
			})
			.then((d) => alive && setData(d))
			.catch(() => alive && setError(true))
		return () => {
			alive = false
		}
	}, [])
	return { data, error }
}

function SafariDesktop({ data, lang, setLang, assetPath }) {
	const [status, setStatus] = useState(() => window.matchMedia(reducedMotion).matches ? "open" : "booting")

	const launcher = useRef(null)
	const viewport = useRef(null)
	const userContent = data.content[lang]
	const ui = data.ui[lang]
	const contact = userContent.contact
	const github = contact?.socials?.find(({ label }) => label === "GitHub")
	const visible = status === "open"
	const booting = status === "booting"

	function hideWindow(nextStatus) {
		if (nextStatus === "closed") setExpanded(false)
		setStatus(nextStatus)
		launcher.current.focus({ preventScroll: true })
	}

	function openWindow() {
		setStatus("open")
		if (visible) viewport.current?.focus({ preventScroll: true })
	}

	useEffect(() => {
		if (visible && document.activeElement === launcher.current) viewport.current?.focus({ preventScroll: true })
	}, [visible])

	useEffect(() => {
		if (!booting) return
		const onKeyDown = (event) => {
			if (event.key === "Escape") setStatus("open")
		}
		const motion = window.matchMedia(reducedMotion)
		const onMotionChange = (event) => {
			if (event.matches) setStatus("open")
		}
		window.addEventListener("keydown", onKeyDown)
		motion.addEventListener("change", onMotionChange)
		return () => {
			window.removeEventListener("keydown", onKeyDown)
			motion.removeEventListener("change", onMotionChange)
		}
	}, [booting])

	return (
		<div className="mac-desktop">
			<MenuBar locale={lang === "jw" ? "jv" : lang} label={ui.desktop.portfolio} />
			<div className={`mac-workspace${expanded ? " mac-expanded" : ""}`}>

							{data.meta.domain}

					<div className="browser-viewport" id="safari-portfolio" ref={viewport} tabIndex={-1}>
						{!booting && status !== "closed" && <Portfolio data={data} lang={lang} setLang={setLang} assetPath={assetPath} viewport={viewport} />}
					</div>
				</div>
			</div>
			<div className="mac-dock">
				<button ref={launcher} type="button" className="dock-item" aria-label={ui.desktop.open} aria-controls="safari-portfolio" aria-expanded={visible} onClick={openWindow}>
					<DockIcon name="safari" label="Safari" />

				<a className="dock-item" href={assetPath + CV_FILE} download={CV_FILE} aria-label={ui.downloadCv}><DockIcon name="cv" label={ui.downloadCv} /></a>
				{github?.url && <a className="dock-item" href={github.url} target="_blank" rel="noreferrer" aria-label="GitHub"><DockIcon name="github" label="GitHub" /></a>}
				{contact?.email && <a className="dock-item" href={`mailto:${contact.email}`} aria-label={ui.nav.contact}><DockIcon name="mail" label={ui.nav.contact} /></a>}
			</div>
		</div>
	)
}

function Topbar({ hero, ui, languages, lang, setLang, active }) {
	const navigation = useRef(null)

	useEffect(() => {
		const nav = navigation.current
		const link = nav.querySelector('[aria-current="location"]')
		if (!link || nav.scrollWidth <= nav.clientWidth) return
		const navBounds = nav.getBoundingClientRect()
		const linkBounds = link.getBoundingClientRect()
		if (linkBounds.left < navBounds.left || linkBounds.right > navBounds.right) {
			nav.scrollLeft += (linkBounds.left + linkBounds.right - navBounds.left - navBounds.right) / 2
		}
	}, [active, lang])

	return (
		<header className="site-topbar">
			<div className="topbar-inner">
				<a href={sectionHref("top")} className="brand" aria-label={hero.name}>

function useActiveSection(viewport) {
	const [active, setActive] = useState(null)
	useEffect(() => {
		const root = viewport.current
		const sections = Array.from(root.querySelectorAll(".portfolio-section"))
		const target = document.getElementById(window.location.hash.slice(1))
		if (root.contains(target)) target.scrollIntoView()

		let frame = 0
		let offset = 0
		const update = () => {
			frame = 0
			if (!root.clientHeight) return
			const end = root.scrollHeight - root.clientHeight
			root.parentElement.style.setProperty("--scroll-progress", end > 0 ? Math.min(1, root.scrollTop / end) : 0)
			if (root.scrollTop <= 1) {
				setActive(null)
				return
			}
			const atBottom = end > 0 && Math.ceil(root.scrollTop) >= end
			const start = root.getBoundingClientRect().top + offset
			// A section near the end may not reach the top of the scroll area.
			if (atBottom) {
				const fragment = sections.find(({ id }) => `#${id}` === window.location.hash)
				if (fragment && fragment.getBoundingClientRect().top >= start) {
					setActive(fragment.id.slice(4))
					return
				}
			}
			for (let i = sections.length - 1; i >= 0; --i) {
				const section = sections[i]
				if (atBottom || section.getBoundingClientRect().top <= start) {
					setActive(section.id.slice(4))
					return
				}
			}
			setActive(null)
		}
		const onScroll = () => {
			if (!frame) frame = window.requestAnimationFrame(update)
		}
		const onResize = () => {
			offset = Number.parseFloat(getComputedStyle(root).scrollPaddingTop) + 20
			onScroll()
		}
		onResize()
		const resizeObserver = new ResizeObserver(onResize)
		resizeObserver.observe(root)
		resizeObserver.observe(root.querySelector(".site-shell"))
		root.addEventListener("scroll", onScroll, { passive: true })
		window.addEventListener("hashchange", onScroll)
		return () => {
			resizeObserver.disconnect()
			root.removeEventListener("scroll", onScroll)
			window.removeEventListener("hashchange", onScroll)
			window.cancelAnimationFrame(frame)
		}
	}, [viewport])
	return active
}

function Portfolio({ data, lang, setLang, assetPath, viewport }) {
	const { hero, summary, experience, proProjects, openProjects, projects, education, skills, certificates, certifications, contact } = data.content[lang]
	const ui = data.ui[lang]
	const active = useActiveSection(viewport)
	const languageAnchor = useRef(null)

	const selectLanguage = (nextLang) => {
		if (nextLang === lang) return
		const root = viewport.current
		const section = document.getElementById(sectionId(active || "top"))
		if (section) {
			languageAnchor.current = { id: section.id, top: section.getBoundingClientRect().top - root.getBoundingClientRect().top }
		}
		setLang(nextLang)
	}

	useLayoutEffect(() => {
		const anchor = languageAnchor.current
		if (!anchor) return
		languageAnchor.current = null
		const section = document.getElementById(anchor.id)
		if (!section) return
		const root = viewport.current
		root.scrollTop += section.getBoundingClientRect().top - root.getBoundingClientRect().top - anchor.top
	}, [lang, viewport])

	return (
		<div className="site-shell">
			<a className="skip-link" href="#main-content">{ui.skipToContent}</a>
			<Topbar hero={hero} ui={ui} languages={data.languages} lang={lang} setLang={selectLanguage} active={active} />
			<main id="main-content" className="site-main" tabIndex={-1}>
				<Hero hero={hero} ui={ui} assetPath={assetPath} />
				{summary && <Summary data={summary} />}
				{experience && <Experience data={experience} />}
				{proProjects && <ProjectList name="proProjects" data={proProjects} />}
				{(openProjects || projects) && <ProjectList name="openProjects" data={openProjects || projects} />}
				{education && <Education data={education} />}
				{skills && <Skills data={skills} />}
				{(certificates || certifications) && <Certificates data={certificates || certifications} />}
				{contact && <Contact data={contact} />}
				<footer className="site-footer">© {new Date().getFullYear()} {hero.name} <a href={sectionHref("top")}>{data.meta.domain} ↑</a></footer>
			</main>
		</div>
	)
}

function App() {
	const { data, error } = useLoadedContent()
	const [lang, setLang] = useState(() => {
		try {
			return localStorage.getItem("lang")
		} catch {
			return null
		}
	})
	const activeLang = data?.languages.some(({ code }) => code === lang) ? lang : data?.meta.defaultLang || "id"

	useEffect(() => {
		document.documentElement.lang = activeLang === "jw" ? "jv" : activeLang
	}, [activeLang])

	const selectLanguage = (code) => {
		setLang(code)
		try {
			localStorage.setItem("lang", code)
		} catch {
			// The selection still works when browser storage is unavailable.
		}
	}

	if (!data) {
		return <p className="load-status" role={error ? "alert" : "status"}>{error ? "Tidak bisa memuat content.json" : "Memuat…"}</p>
	}
	const assetPath = window.location.protocol === "file:" ? "public/" : ""
	return <SafariDesktop data={data} lang={activeLang} setLang={selectLanguage} assetPath={assetPath} />
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
